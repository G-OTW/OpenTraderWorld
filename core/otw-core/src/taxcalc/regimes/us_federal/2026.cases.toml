[[case]]
name = "Long-term gain across the 0 % and 15 % brackets"
source = "IRC 1(h): 9 450 at 0 %, 550 at 15 % on top of 40 000"
inputs = { realized_capital_gains = 10000.0, long_term = { capital = 10000.0 }, other_income = 40000.0 }
expect = { total_tax = 82.5 }

[[case]]
name = "Short-term gain at ordinary rates"
source = "IRC 1: 10 000 at 12 % on top of 40 000"
inputs = { realized_capital_gains = 10000.0, other_income = 40000.0 }
expect = { total_tax = 1200.0 }

[[case]]
name = "NIIT on a high earner"
source = "IRC 1(h) 15 % + IRC 1411 3.8 %"
inputs = { realized_capital_gains = 100000.0, long_term = { capital = 100000.0 }, other_income = 250000.0 }
expect = { total_tax = 18800.0 }

[[case]]
name = "A short-term loss nets against a long-term gain"
source = "IRC 1222: net short-term loss reduces net long-term gain"
inputs = { realized_capital_gains = 5000.0, long_term = { capital = 8000.0 }, other_income = 40000.0 }
expect = { total_tax = 0.0 }

[[lots_case]]
name = "Wash sale: the loss moves onto the repurchase"
source = "IRC 1091, IRS Pub. 550 (wash sales)"
fills = [
  { at = "2025-01-02", side = "buy", qty = 10, price = 100 },
  { at = "2025-03-01", side = "sell", qty = 10, price = 80 },
  { at = "2025-03-11", side = "buy", qty = 10, price = 85 },
  { at = "2025-06-01", side = "sell", qty = 10, price = 90 },
]
expect = { total_gain = -150.0, disallowed = 200.0 }
