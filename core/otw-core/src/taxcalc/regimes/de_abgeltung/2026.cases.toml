[[case]]
name = "Share gain after the Sparer-Pauschbetrag, with Soli"
source = "EStG 32d, 20 (9); SolZG: (5 000 - 1 000) x 25 % x 1.055"
inputs = { realized_capital_gains = 5000.0 }
expect = { total_tax = 1055.0 }

[[case]]
name = "A derivative loss offsets a share gain"
source = "EStG 20 (6): the general pot offsets share gains; (4 000 - 1 500 - 1 000) x 25 % x 1.055"
inputs = { realized_capital_gains = 4000.0, derivative_gains = -1500.0 }
expect = { total_tax = 395.625, pools = { general = { loss_created = 0.0 } } }

[[case]]
name = "The Freigrenze exempts only gains below 1 000 EUR"
source = "EStG 23 (3) S. 5: weniger als 1 000 Euro"
inputs = { crypto_gains = 1000.0, marginal_rate = 30.0 }
expect = { total_tax = 300.0 }

[[case]]
name = "A share loss does not offset a derivative gain"
source = "EStG 20 (6) S. 4: share losses only against share gains"
inputs = { realized_capital_gains = -2000.0, derivative_gains = 3000.0 }
expect = { total_tax = 527.5 }

[[case]]
name = "Crypto held over a year is exempt, short-term gains under 1 000 EUR too"
source = "EStG 23 (1) Nr. 2 and 23 (3) S. 5 (Freigrenze)"
inputs = { crypto_gains = 10900.0, long_term = { crypto = 10000.0 } }
expect = { total_tax = 0.0 }

[[case]]
name = "Short-term crypto over the Freigrenze is taxed in full at the marginal rate"
source = "EStG 23 (3) S. 5: a threshold, not an allowance"
inputs = { crypto_gains = 1500.0, marginal_rate = 42.0 }
expect = { total_tax = 630.0 }

[[lots_case]]
name = "FIFO: the oldest lot is sold first"
source = "EStG 20 (4) S. 7"
fills = [
  { at = "2025-01-02", side = "buy", qty = 10, price = 100 },
  { at = "2025-02-02", side = "buy", qty = 10, price = 200 },
  { at = "2025-03-02", side = "sell", qty = 10, price = 180 },
]
expect = { total_gain = 800.0 }
