sources = [
  "CGI art. 200 A (prélèvement forfaitaire unique, 12.8 %)",
  "LFSS 2026 art. 12, CSS L136-8: CSG 10.6 % (social charges 18.6 %) on revenus du patrimoine from 2025 income, on produits de placement from 1 January 2026 (impots.gouv.fr, Brochure pratique IR 2026, Principales nouveautés)",
  "CGI art. 150-0 D (PMP, losses carried 10 years)",
  "CGI art. 150 VH bis (digital assets, 305 EUR threshold, no carry)",
]
notes = "2025: gains (securities, derivatives, crypto) take 18.6 % social charges, dividends and interest paid through a French paying agent 17.2 % (withheld when paid in 2025; foreign-paid ones are revenus du patrimoine at 18.6 %). Not modeled: the global option for the progressive scale (2OP) with its allowances, CEHR, CDHR, PEA and life insurance wrappers."
