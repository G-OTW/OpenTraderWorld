# OKX v5. Every claim below is sourced in PROVIDER.md.

provider = "okx"
label = "OKX"
venue = "OKX"
api_version = "v5"
maturity = "M2"
asset_classes = ["spot", "perp", "future"]
instrument_discovery = "full"
auth = "none"
# Daily and weekly are the UTC-anchored bars (1Dutc, 1Wutc): OKX's plain 1D opens at 16:00 UTC.
native_timeframes = ["1m", "5m", "15m", "1h", "4h", "1d", "1w"]

[live]
candles = "push"
# Best bid and ask (`bbo-tbt`, public socket).
quote = "push"

[history]
quote = true
board = true

[history.candles]
max_items_per_call = 300
paging = "time"

[[rate_limits]]
scope = "ip"
capacity = 20
refill_ms = 2000

# Endpoints whose own limit is under the one above (each "per 2 seconds", rule User ID):
# Get positions 10, Get account configuration 5, Transaction details (last 3 months) 10 (the
# order path's `fills_history` and the account read's `fillsHistory`).
[[rate_limits]]
scope = "endpoint"
endpoint = "positions"
capacity = 10
refill_ms = 2000

[[rate_limits]]
scope = "endpoint"
endpoint = "account_config"
capacity = 5
refill_ms = 2000

[[rate_limits]]
scope = "endpoint"
endpoint = "fills_history"
capacity = 10
refill_ms = 2000

[[rate_limits]]
scope = "endpoint"
endpoint = "fillsHistory"
capacity = 10
refill_ms = 2000

[account]
balances = true
positions = true
fills_history = true
open_orders = true
summary = true
quote_preference = ["USDT", "USDC", "USD", "EUR", "BTC"]
quote_reverse = true
# Demo trading shares the host and needs an extra header (the signer adds it).
sandbox_env = "demo"
