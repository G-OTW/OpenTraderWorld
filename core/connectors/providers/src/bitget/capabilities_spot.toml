# Bitget spot. Every claim below is sourced in PROVIDER.md.

provider = "bitget"
label = "Bitget"
venue = "BITGET"
api_version = "v2"
maturity = "M2"
asset_classes = ["spot"]
instrument_discovery = "full"
auth = "none"
# Daily and weekly are the UTC-anchored bars (1Dutc, 1Wutc): Bitget's plain 1day opens at 16:00 UTC.
native_timeframes = ["1m", "5m", "15m", "1h", "4h", "1d", "1w"]

[live]
candles = "push"
# Best bid and ask (`books1`).
quote = "push"

[history]
quote = true
board = true

[history.candles]
max_items_per_call = 200
paging = "time"

[[rate_limits]]
scope = "ip"
capacity = 20
refill_ms = 1000

[account]
balances = true
fills_history = true
open_orders = true
summary = true
quote_preference = ["USDT", "USDC", "EUR", "BTC"]
quote_reverse = true
venue_label = "Bitget"
