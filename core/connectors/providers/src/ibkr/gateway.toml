# Interactive Brokers over a local IB Gateway or TWS (TWS API). Every claim below is sourced
# in PROVIDER.md.

provider = "ibkr"
label = "Interactive Brokers"
venue = "IBKR"
api_version = "TWS API (ibapi 2.12)"
maturity = "M2"
asset_classes = ["equity", "etf", "spot", "forex", "index", "future", "option"]
instrument_discovery = "search_only"
# An address, not a credential: the user's own gateway.
auth = "local_gateway"
native_timeframes = ["5s", "1m", "5m", "15m", "30m", "1h", "4h", "1d", "1w"]

# Prints (or the midpoint) where IB streams ticks, five-second bars where it does not.
[live]
trades = "push"
candles = "push"
candle_timeframes = ["5s"]

[history]
quote = true

# IB flags no bar as forming: the period's end decides.
[history.candles]
max_items_per_call = 2000
paging = "time"
final_flag = false
timeframes = ["1m", "5m", "15m", "30m", "1h", "4h", "1d", "1w"]

# 60 historical requests per rolling ten minutes per account; the session paces 55.
[[rate_limits]]
scope = "account"
capacity = 55
refill_ms = 600000

# Execution (v2). Paper accounts only until `level` is E4: the session refuses a
# gateway signed in to a live account. Brackets are IB's attached orders (parentId), OCO its
# OCA groups; the client order id rides as orderRef. TRAIL by amount or percent from the
# market, MIT, LIT, icebergs (displaySize), outside RTH, the trigger method, and IB's Adaptive
# algo on market and limit orders.
[orders]
types = ["market", "limit", "stop", "stop_limit", "trailing_stop", "mit", "lit"]
tif = ["day", "gtc", "gtd", "ioc", "fok"]
amend = true
brackets = true
oca = true
trail = ["amount", "percent"]
iceberg = true
outside_rth = true
triggers = ["last", "bid_ask", "mid"]
adaptive = true
client_id = true
level = "E4"
cancel_on_disconnect = false
