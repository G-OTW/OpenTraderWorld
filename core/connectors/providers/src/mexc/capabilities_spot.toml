# MEXC spot. Every claim below is sourced in PROVIDER.md.

provider = "mexc"
label = "MEXC"
venue = "MEXC"
api_version = "v3"
maturity = "M2"
asset_classes = ["spot"]
instrument_discovery = "full"
auth = "none"
# Daily bars open at midnight UTC, weekly ones (`1W`) on Monday, monthly ones (`1M`) on the
# first of the calendar month.
native_timeframes = ["1m", "5m", "15m", "30m", "1h", "4h", "8h", "1d", "1w", "1M"]
# One socket carries 30 subscriptions at most.
max_subs_per_connection = 30

[live]
candles = "push"
# The socket's candles carry no closed flag: the engine closes one when the next starts.
candles_final_flag = false
# Best bid and ask (spot `aggre.bookTicker`, contracts `sub.ticker`).
quote = "push"

[history]
quote = true
board = true

[history.candles]
max_items_per_call = 500
paging = "time"

# 500 requests per 10 s per endpoint and IP.
[[rate_limits]]
scope = "ip"
capacity = 500
refill_ms = 10000

# New order and cancel order: "Shared with the cancel order endpoint, 12 requests/second" (the
# cancel is `spot_order:cancel`, counted here).
[[rate_limits]]
scope = "endpoint"
endpoint = "spot_order"
capacity = 12
refill_ms = 1000

[account]
balances = true
fills_history = true
open_orders = true
summary = true
fills_need_symbols = true
spot_only = true
quote_preference = ["USDT", "USDC", "BTC", "ETH"]
quote_reverse = true
venue_label = "MEXC"

# Orders, from the documentation alone (PROVIDER.md "Trading"): E2D, never run against the
# venue. The time in force is the order type (`LIMIT`, `LIMIT_MAKER`, `IMMEDIATE_OR_CANCEL`,
# `FILL_OR_KILL`, `MARKET`); a market buy is an amount to spend in the quote coin, valued at the
# best ask just before it is sent. The order test endpoint is the dry run. No stop (the "Market
# TP/SL" type has no documented placing parameter), no amend, no batch.
[orders]
types = ["market", "limit"]
tif = ["gtc", "ioc", "fok"]
post_only = true
client_id = true
cancel_all_native = true
dry_run = "validate"
level = "E2D"
