# Bybit linear contracts (USDT and USDC perpetuals, USDT dated futures). Every claim below is
# sourced in PROVIDER.md.

provider = "bybit"
label = "Bybit linear"
venue = "BYBIT_LINEAR"
api_version = "v5"
maturity = "M2"
asset_classes = ["perp", "future"]
instrument_discovery = "full"
auth = "none"
native_timeframes = ["1m", "3m", "5m", "15m", "30m", "1h", "2h", "4h", "6h", "12h", "1d", "1w", "1M"]

[live]
candles = "push"
# Best bid and ask (`orderbook.1.<symbol>`).
quote = "push"

[history]
quote = true

[history.candles]
max_items_per_call = 1000
paging = "time"

[[rate_limits]]
scope = "ip"
capacity = 600
refill_ms = 5000

[account]
positions = true
fills_history = true
open_orders = true
summary = true
venue_label = "Bybit linear"
