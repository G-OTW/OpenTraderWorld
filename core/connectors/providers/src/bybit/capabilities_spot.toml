# Bybit spot. Every claim below is sourced in PROVIDER.md.

provider = "bybit"
label = "Bybit"
venue = "BYBIT"
api_version = "v5"
maturity = "M2"
asset_classes = ["spot"]
instrument_discovery = "full"
auth = "none"
# Bybit's daily bar opens at midnight UTC and its weekly bar on Monday, so no variant is needed.
native_timeframes = ["1m", "3m", "5m", "15m", "30m", "1h", "2h", "4h", "6h", "12h", "1d", "1w", "1M"]

[live]
candles = "push"
# Best bid and ask (`orderbook.1.<symbol>`).
quote = "push"

[history]
quote = true
board = true

[history.candles]
max_items_per_call = 1000
paging = "time"

[[rate_limits]]
scope = "ip"
capacity = 600
refill_ms = 5000

[account]
balances = true
fills_history = true
open_orders = true
summary = true
quote_preference = ["USDT", "USDC", "EUR", "BTC"]
quote_reverse = true
venue_label = "Bybit"

# Execution (v2), from the documentation alone (PROVIDER.md "Trading"): E2D, never run against
# the venue. Market and limit orders; a stop on spot has no documented trigger direction, so it
# is not declared. No reduce-only (a spot sale of what is held is a plain sell), no position.
# Bybit's pre-check serves no spot order: no dry run.
[orders]
types = ["market", "limit"]
tif = ["gtc", "ioc", "fok"]
client_id = true
cancel_all_native = true
level = "E2D"
