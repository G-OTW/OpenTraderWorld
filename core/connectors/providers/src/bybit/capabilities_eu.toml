# Bybit EU (bybit.eu) spot: a separate platform with its own order book, hosts and keys.
# Every claim below is sourced in PROVIDER.md.

provider = "bybit_eu"
label = "Bybit EU"
venue = "BYBIT_EU"
api_version = "v5"
maturity = "M2"
asset_classes = ["spot"]
instrument_discovery = "full"
auth = "none"
native_timeframes = ["1m", "3m", "5m", "15m", "30m", "1h", "2h", "4h", "6h", "12h", "1d", "1w", "1M"]

[live]
candles = "push"
# Best bid and ask (`orderbook.1.<symbol>`).
quote = "push"

[history]
quote = true
board = true

[history.candles]
max_items_per_call = 1000
paging = "time"

[[rate_limits]]
scope = "ip"
capacity = 600
refill_ms = 5000

[account]
balances = true
fills_history = true
open_orders = true
summary = true
quote_preference = ["USDT", "USDC", "EUR", "BTC"]
quote_reverse = true
venue_label = "Bybit EU"
