# Gate.io USDT-settled perpetual contracts. Every claim below is sourced in PROVIDER.md.

provider = "gateio"
label = "Gate.io futures"
venue = "GATEIO_FUTURES"
api_version = "v4"
maturity = "M2"
asset_classes = ["perp"]
instrument_discovery = "full"
auth = "none"
# Daily bars open at midnight UTC, weekly ones (`1w`) on Monday. The futures `7d` bar opens
# on Thursday and its `30d` bar is not a calendar month, so neither is used.
native_timeframes = ["1m", "5m", "15m", "30m", "1h", "4h", "8h", "1d", "1w"]

[live]
candles = "push"
# Best bid and ask (`spot.book_ticker` / `futures.book_ticker`).
quote = "push"

[history]
quote = true

[history.candles]
max_items_per_call = 2000
paging = "time"

[[rate_limits]]
scope = "ip"
capacity = 200
refill_ms = 10000

[account]
positions = true
fills_history = true
open_orders = true
summary = true
venue_label = "Gate.io futures"
