# Bitfinex perpetual derivatives (`<BASE>F0:<QUOTE>F0`, settled in USDt or BTC). The
# account of both books is read by the spot adapter. Every claim below is sourced in
# PROVIDER.md.

provider = "bitfinex"
label = "Bitfinex derivatives"
venue = "BITFINEX_PERP"
api_version = "v2"
maturity = "M2"
asset_classes = ["perp"]
instrument_discovery = "full"
auth = "none"
# Bars open at midnight UTC (and on the hour for 3h, 4h, 6h, 12h), weekly ones (`1W`) on
# Monday, monthly ones (`1M`) on the first of the calendar month.
native_timeframes = ["1m", "5m", "15m", "30m", "1h", "3h", "4h", "6h", "12h", "1d", "1w", "1M"]
# The socket docs say 30 subscriptions per socket (the limits page says 25).
max_subs_per_connection = 30

[live]
candles = "push"
# The socket's candles carry no closed flag: the engine closes one when the next starts.
candles_final_flag = false
# Best bid and ask (a one-level `book`, P0).
quote = "push"

[history]
quote = true

[history.candles]
max_items_per_call = 10000
paging = "time"

# Requests per minute and IP, per endpoint (docs). An IP over a limit is blocked for 60 s.
[[rate_limits]]
scope = "endpoint"
endpoint = "candles"
capacity = 30
refill_ms = 60000

[[rate_limits]]
scope = "endpoint"
endpoint = "ticker"
capacity = 90
refill_ms = 60000

[[rate_limits]]
scope = "endpoint"
endpoint = "conf"
capacity = 90
refill_ms = 60000

# The account of both books is read by the spot adapter; its rows of this book carry this label,
# which routes an order or a close from the account's panel here. Nothing is read here.
[account]
venue_label = "Bitfinex derivatives"

# Orders on the perpetuals (`<BASE>F0:<QUOTE>F0`), unprefixed types, over REST. Every claim
# sourced in PROVIDER.md ("Trading"). One net position per instrument, read from the venue,
# never changed; reduce-only is a flag; an order carries the leverage the venue states for the
# held position (`lev`), none when flat. Prices changed in place, with that leverage. No close
# flag (512), no OCO, no dry run (the venue has none).
[orders]
types = ["market", "limit", "stop", "stop_limit"]
tif = ["gtc", "gtd", "ioc", "fok"]
post_only = true
reduce_only = true
amend = true
client_id = true
position_mode = "net"
level = "E2D"

[[rate_limits]]
scope = "endpoint"
endpoint = "orderSubmit"
capacity = 90
refill_ms = 60000

[[rate_limits]]
scope = "endpoint"
endpoint = "orderUpdate"
capacity = 90
refill_ms = 60000

[[rate_limits]]
scope = "endpoint"
endpoint = "orderCancel"
capacity = 90
refill_ms = 60000

[[rate_limits]]
scope = "endpoint"
endpoint = "orderCancelMulti"
capacity = 90
refill_ms = 60000

[[rate_limits]]
scope = "endpoint"
endpoint = "orders"
capacity = 90
refill_ms = 60000

[[rate_limits]]
scope = "endpoint"
endpoint = "ordersSymbol"
capacity = 90
refill_ms = 60000

[[rate_limits]]
scope = "endpoint"
endpoint = "ordersHist"
capacity = 90
refill_ms = 60000

[[rate_limits]]
scope = "endpoint"
endpoint = "tradesSymbolHist"
capacity = 90
refill_ms = 60000

[[rate_limits]]
scope = "endpoint"
endpoint = "positions"
capacity = 90
refill_ms = 60000
