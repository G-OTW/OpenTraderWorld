# Yahoo Finance chart and search endpoints (unofficial, keyless). Every claim below is
# sourced in PROVIDER.md.

provider = "yahoo"
label = "Yahoo Finance"
venue = "YAHOO"
api_version = "chart v8, search v1"
maturity = "M2"
asset_classes = ["equity", "etf", "index", "spot"]
# No list to load: each query is answered by the search endpoint.
instrument_discovery = "search_only"
auth = "none"
native_timeframes = ["1m", "5m", "15m", "1h", "1d", "1w"]

[history.candles]
max_items_per_call = 5000
paging = "time"
# No forming flag: the engine finalizes a bar at its period's end.
final_flag = false
