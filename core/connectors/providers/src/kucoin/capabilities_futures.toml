# KuCoin Futures, USDT- and USDC-margined contracts. Every claim below is sourced in
# PROVIDER.md.

provider = "kucoin_futures"
label = "KuCoin Futures"
venue = "KUCOIN_FUTURES"
api_version = "v1"
maturity = "M2"
asset_classes = ["perp", "future"]
instrument_discovery = "full"
auth = "none"
# Daily bars open at midnight UTC, weekly ones on Monday.
native_timeframes = ["1m", "5m", "15m", "30m", "1h", "2h", "4h", "8h", "12h", "1d", "1w"]

[live]
candles = "push"
candles_final_flag = false
# Best bid and ask (`/market/ticker` / `/contractMarket/tickerV2`).
quote = "push"

[history]
quote = true

[history.candles]
max_items_per_call = 200
paging = "time"

# Public pool: 2000 weight per 30 s per IP; a candle page weighs 3.
[[rate_limits]]
scope = "ip"
capacity = 2000
refill_ms = 30000

[account]
positions = true
fills_history = true
open_orders = true
summary = true
venue_label = "KuCoin Futures"
